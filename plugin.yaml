name: hermes-travel
version: 0.3.0
description: Trip planner — stays and transport with comparable cards
status: experimental
provides_tools:
  - search_booking
  - search_airbnb
  - search_agoda
  - search_hostelworld
  - search_flixbus
  - search_rome2rio
  - search_flights
  - changi_timetable
  - compare_stays
  - plan_leg
requires_env:
  - name: APIFY_API_TOKEN
    description: Travel data API token
    url: https://console.apify.com/account/integrations
    secret: true
python_dependencies:
  - "apify-client>=1.8"
