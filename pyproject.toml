[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-travel-rl1987"
version = "0.1.0"
description = "Travel toolkit wrapping only rl1987 Apify Actors"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["apify-client>=1.8"]

[project.optional-dependencies]
dev = ["pytest"]

[project.entry-points."hermes_agent.plugins"]
hermes-travel-rl1987 = "hermes_travel_rl1987"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hermes_travel_rl1987 = ["skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"
